name: Deploy to Azure App Service

on:
  push:
    branches:
      - Test-Cloud

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: niveshakregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Tag Docker Image
        run: |
          docker build -t niveshakregistry.azurecr.io/rapid-keys:latest .

      - name: Push Docker Image to ACR
        run: |
          docker push niveshakregistry.azurecr.io/rapid-keys:latest

      - name: Deploy to Azure Web App via SCM Webhook
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          # Parse SCM credentials from Publish Profile using python
          CREDS=$(python3 -c "
          import xml.etree.ElementTree as ET
          import os, sys
          try:
              root = ET.fromstring(os.environ['PUBLISH_PROFILE'])
              for p in root.findall('publishProfile'):
                  if p.attrib.get('publishMethod') == 'MSDeploy':
                      print(p.attrib.get('userName') + ':' + p.attrib.get('userPWD'))
                      sys.exit(0)
          except Exception as e:
              print('Error parsing publish profile:', e, file=sys.stderr)
          sys.exit(1)
          ")
          
          # Trigger container reload via Kudu SCM Webhook
          curl -f -X POST -u "$CREDS" \
            -H "Content-Type: application/json" \
            https://rapid-keys-app.scm.azurewebsites.net/api/registry/webhook

