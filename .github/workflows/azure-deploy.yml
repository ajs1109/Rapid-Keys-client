name: Deploy to Azure App Service

on:
  push:
    branches:
      - Test-Cloud

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: niveshakregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Tag Docker Image
        run: |
          docker build -t niveshakregistry.azurecr.io/rapid-keys:latest .

      - name: Push Docker Image to ACR
        run: |
          docker push niveshakregistry.azurecr.io/rapid-keys:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rapid-keys-app'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'niveshakregistry.azurecr.io/rapid-keys:latest'
